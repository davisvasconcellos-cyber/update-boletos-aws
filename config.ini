# ==============================================================================
# ARQUIVO DE CONFIGURAÇÃO — update_boletos_aws
# Médicos Sem Fronteiras (MSF) — Sincronização de Boletos (SQL Server ➔ AWS MySQL)
# ==============================================================================
# DICA: Linhas iniciadas com '#' ou ';' são comentários e são ignoradas pelo sistema.
# O sistema utiliza RawConfigParser, permitindo senhas com '%' e caracteres especiais.
# ==============================================================================

[banco]
# IP ou hostname do servidor SQL Server de origem (BDVIRT local)
servidor_ip = 192.168.1.20

# Nome do banco de dados onde reside a Stored Procedure oficial
database = VINDI

# Nome da procedure oficial que retorna as faturas e dados de clientes (25 colunas)
procedure_name = CarregaFaturasBoletoWS

# Tempo limite em segundos para estabelecer a conexão inicial via ODBC
connect_timeout_seconds = 10


[FILTRO]
# Parâmetros de data de vencimento passados para a procedure CarregaFaturasBoletoWS:
# Formato: AAAA-MM-DD (ex.: 2026-11-01)
# - Se deixados em BRANCO: a aplicação calcula automaticamente cobrindo desde o
#   primeiro dia do mês corrente até faturas de meses futuros (visão de 60-90 dias).
# - Se preenchidos: a procedure executa exatamente para o intervalo especificado.
data_inicio = 
data_fim = 


[AMBIENTE]
# Define o comportamento do destino:
# - mockup:  Modo Simulado / Dry-Run seguro. Lê o SQL Server real, formata todas as
#            colunas, deriva códigos de barra, gera o backup CSV e o Dashboard HTML,
#            mas NÃO abre túnel nem envia dados para a AWS (ideal para validação local).
# - sandbox: Modo Real de Homologação na AWS (conecta via túnel SSH no Bastion e grava
#            na tabela boletos_segunda_via do banco msf_cobranca).
# - prod:    Modo de Produção oficial na AWS.
ambiente = sandbox


[SSH]
# Configurações do túnel SSH pelo servidor Bastion para alcançar o banco MySQL privado
use_ssh_tunnel = true

# IP público do Bastion Host na AWS (us-east-1)
ssh_host = 34.204.24.206
ssh_port = 22

# Usuário autorizado no Bastion
ssh_user = davis.vasconcellos

# Caminho da chave privada SSH (relativo à pasta do projeto ou absoluto)
# - Para uso com passphrase oficial: ssh/id_ed25519
# - Para uso sem passphrase (ex.: plugins/DBeaver): ssh/id_ed25519_nopass
ssh_key_path = ssh/id_ed25519

# Senha (passphrase) da chave SSH privada
ssh_key_passphrase = Codebit@msf2026.


[MYSQL_AWS]
# Configurações do banco de dados MySQL de destino na AWS (visto através do Bastion)
mysql_url = 

# Endpoint / IP interno do MySQL visto de dentro da AWS
mysql_host = 10.1.10.101
mysql_port = 3306

# Credenciais de acesso ao MySQL
mysql_user = davis.vasconcellos
mysql_password = {V)>sOucd6%L2qbBITpa
mysql_database = msf_cobranca

# Tabela oficial de destino (51 colunas relacionais)
mysql_target_table = boletos_segunda_via


[PROCESSAMENTO]
# ------------------------------------------------------------------------------
# INSTRUÇÕES DO MODO DE TESTE (test_mode):
# ------------------------------------------------------------------------------
# - test_mode = true:
#     Processa apenas 1 ÚNICO LOTE com até 'max_records' registros (ex: 5, 10 ou 50).
#     NÃO avança a data de corte (last_sync_timestamp), permitindo testes repetidos.
#     Também pode ser acionado via linha de comando ou atalho sem editar este arquivo:
#       rodar_teste.bat           -> Envia 1 lote de teste
#       main.exe testmode 5       -> Força envio de apenas 5 registros
#
# - test_mode = false:
#     Modo NORMAL de Produção. Processa todas as dezenas de milhares de faturas
#     retornadas pela procedure, fatiando em lotes de 'max_records'.
#     Atualiza automaticamente o 'last_sync_timestamp' ao final de um envio 100% OK.
# ------------------------------------------------------------------------------
test_mode = false

# Quantidade máxima de registros por lote no envio (Recomendado: 1000).
# Internamente, a aplicação agrupa em blocos multi-row de 500 registros por query SQL,
# permitindo sincronizar 60.000 faturas em menos de 2 minutos.
max_records = 1000

# Timeout em segundos para a execução da Stored Procedure no SQL Server
db_query_timeout_seconds = 300

# Tamanho do bloco para leitura paginada com cursor.fetchmany() no SQL Server
db_fetch_chunk_size = 1000

# Carimbo de data/hora da última execução com sucesso (atualizado automaticamente pelo sistema)
last_sync_timestamp = 

# Backup físico em arquivo CSV:
# Gera automaticamente uma cópia em formato .csv contendo todos os dados finais tratados.
gerar_csv_backup = true
diretorio_csv_backup = backups_csv/


[LOG]
# Diretório para armazenamento dos arquivos de log individuais por execução (.log)
diretorio = logs/

# Caminho do relatório visual interativo em HTML (Bootstrap 5 com cards e abas de falha)
dashboard_html = log_dashboard/dashboard.html

# ==============================================================================
# GUIA RÁPIDO DE COMANDOS (EXECUTÁVEL main.exe / BAT):
# ==============================================================================
# - main.exe check          -> Diagnóstico completo (testa SQL Server e MySQL AWS)
# - main.exe testmode       -> Executa 1 lote de teste (lendo max_records deste arquivo)
# - main.exe testmode 10    -> Executa 1 lote de teste com exatamente 10 registros
# - main.exe normal         -> Executa a carga completa de produção
# - rodar_update.bat        -> Atalho para carga completa normal
# - rodar_teste.bat         -> Atalho para teste rápido
# - testar_procedure.bat    -> Testa apenas a procedure no SQL Server
# - testar_mysql.bat        -> Testa apenas a conexão e contagem no MySQL AWS
# - abrir_tunel_ssh.bat     -> Abre o túnel na porta 3307 para DBeaver / Plugins
# ==============================================================================
