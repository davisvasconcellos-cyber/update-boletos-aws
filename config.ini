[banco]
# IP ou hostname do servidor SQL Server de origem
servidor_ip = 192.168.1.20
database = VINDI
procedure_name = CarregaFaturasBoletoWS
connect_timeout_seconds = 10

[FILTRO]
# Datas para a procedure CarregaFaturasBoletoWS 'data_inicio', 'data_fim'
# Se deixadas em branco, a aplicacao calcula automaticamente (mes corrente ate proximo mes)
data_inicio = 
data_fim = 

[AMBIENTE]
# Valores aceitos: mockup, sandbox, prod
# mockup: simula envio para testes locais seguros
# sandbox: conecta no MySQL e faz o envio e criacao real da tabela
ambiente = sandbox

[SSH]
# Configuracoes do tunel SSH (defina use_ssh_tunnel = false para conexao direta ao MySQL)
use_ssh_tunnel = false
ssh_host = ec2-xx-xx-xx-xx.compute-1.amazonaws.com
ssh_port = 22
ssh_user = ec2-user
ssh_key_path = ssh/id_ed25519
ssh_key_passphrase = 

[MYSQL_AWS]
# Configuracoes do banco MySQL remoto (direto ou via tunel)
# Suporta mysql_url direta ou parametros individuais:
mysql_url = mysql://boleto-aws:MsfBoleto@2026@147.15.99.82:5438/boleto-aws
mysql_host = 147.15.99.82
mysql_port = 5438
mysql_user = boleto-aws
mysql_password = MsfBoleto@2026
mysql_database = boleto-aws
mysql_target_table = boletos

[PROCESSAMENTO]
test_mode = false
max_records = 50
db_query_timeout_seconds = 180
db_fetch_chunk_size = 1000
last_sync_timestamp = 
# Gera backup físico em CSV dos dados formatados que sobem para o MySQL
gerar_csv_backup = true
diretorio_csv_backup = backups_csv/

[LOG]
diretorio = logs/
dashboard_html = log_dashboard/dashboard.html
